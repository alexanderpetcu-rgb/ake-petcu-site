<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Content Admin — Ake Petcu</title>
  <!-- This page loads Decap CMS (open-source, free) from its official CDN.
       It reads admin/config.yml, which tells it what content.json looks
       like, and lets you edit it — including uploading and removing images —
       through Netlify Identity + Git Gateway, committing straight to GitHub.
       See the README for the one-time setup steps. -->
</head>
<body>
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
  <script>
    if (window.netlifyIdentity) {
      window.netlifyIdentity.on("init", function (user) {
        if (!user) {
          window.netlifyIdentity.on("login", function () {
            document.location.href = "/admin/";
          });
        }
      });
    }
  </script>
</body>
</html>
