<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Post Production — Ake Petcu</title>
<meta name="description" content="Post production projects — Ake Petcu.">
<style>
:root{--cream:#f2f0eb;--ink:#111;--dark:#0a0e0f;--light:#f2f0eb;--muted:#6b6863;--rail:230px}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;font-family:Georgia,"Times New Roman",serif;background:var(--dark);color:var(--light)}
a{color:inherit;text-decoration:none}img{display:block;width:100%;height:100%;object-fit:cover}
.detail{min-height:100vh;padding:0 0 26px;position:relative}
.brand{font-family:Arial,Helvetica,sans-serif;font-size:12px;letter-spacing:.08em}
.rail{display:flex;flex-direction:column;align-items:flex-start;gap:10px;font-family:Arial,Helvetica,sans-serif;font-size:11px;letter-spacing:.08em}.topnav{display:flex;justify-content:space-between;align-items:flex-start;padding:34px 5vw 0}
.rail a{position:relative}.rail a.active:before{content:"•";position:absolute;margin-left:-22px;font-size:16px;line-height:8px}
.crumbs{font-family:Arial,Helvetica,sans-serif;font-size:10px;letter-spacing:.1em;color:#a9a59d;margin:0 0 14px}.backlink{display:inline-block;font-family:Arial,Helvetica,sans-serif;font-size:10px;letter-spacing:.1em;color:#a9a59d;margin:0 0 18px;border-bottom:1px solid transparent}.backlink:hover{border-bottom-color:currentColor}
.crumbs a{border-bottom:1px solid transparent}.crumbs a:hover{border-bottom-color:currentColor}
.page{max-width:1280px;margin:56px auto 0;padding:0 5vw}.page h1{font-weight:400;font-size:clamp(46px,5.6vw,74px);line-height:.95;margin:0 0 14px}
.tagline{font-size:clamp(16px,1.3vw,20px);margin:0 0 40px;color:#d8d5cf}
.list{display:grid;gap:1px;background:#2a2d2e;border-top:1px solid #2a2d2e}
.proj{background:var(--dark);display:grid;grid-template-columns:220px 1fr auto;gap:26px;align-items:center;padding:22px 6px;text-decoration:none;color:inherit}
.proj figure{margin:0;aspect-ratio:16/10;overflow:hidden;background:#151819}
.proj .meta{font-family:Arial,Helvetica,sans-serif}
.proj .meta .ptype{font-size:10px;letter-spacing:.1em;color:#a9a59d;margin-bottom:6px}
.proj .meta h2{font-family:Georgia,"Times New Roman",serif;font-weight:400;font-size:26px;margin:0 0 8px}
.proj .meta p{font-size:13px;line-height:1.5;color:#c9c5bd;margin:0;max-width:480px}
.proj .go{font-family:Arial,Helvetica,sans-serif;font-size:10px;letter-spacing:.1em;white-space:nowrap}
.footer{display:flex;justify-content:space-between;align-items:center;margin-top:90px;font-family:Arial,Helvetica,sans-serif;font-size:9px;color:#a9a59d}
.footer-links{display:flex;gap:15px}.footer-links a+a:before{content:"|";margin-right:15px;color:#666}
#maintenance-banner{display:none}
html[data-site-down="1"] body>*:not(#maintenance-banner){display:none!important}
html[data-site-down="1"] #maintenance-banner{display:flex!important;min-height:100vh;align-items:center;justify-content:center;font-family:Arial,Helvetica,sans-serif;font-size:13px;letter-spacing:.06em;background:var(--dark);color:var(--light);text-align:center;padding:5vw}
@media(max-width:900px){.topnav{padding:28px 7vw 0;flex-direction:column;align-items:flex-start;gap:14px}.page{padding:0 7vw;margin-top:28px}.rail{flex-direction:row;flex-wrap:wrap;gap:14px}.proj{grid-template-columns:1fr;gap:12px}.footer{flex-direction:column;gap:10px;align-items:flex-start}}
</style></head>
<body>
<div id="maintenance-banner">This site is temporarily offline for updates. Please check back soon.</div>
<script src="data.js"></script>
<div class="detail">
 <div class="topnav"><a class="brand" href="index.html#top">AKE PETCU</a>
 <nav class="rail" aria-label="Primary"><a href="photography.html">PHOTOGRAPHY</a><a class="active" href="post-production.html">POST PRODUCTION</a><a href="index.html#about">ABOUT</a><a href="index.html#contact">CONTACT</a></nav></div>
 <div class="page">
  <a href="post-production.html" class="backlink" id="back-link" onclick="if(history.length>1){event.preventDefault();history.back();}">← BACK</a>
  <p class="crumbs"><a href="post-production.html">POST PRODUCTION</a> → <span id="crumb-cat"></span></p>
  <h1 id="cat-title"></h1>
  <p class="tagline" id="cat-tagline"></p>
  <div class="list" id="list"></div>
  <footer class="footer"><span>© 2026 AKE PETCU. All rights reserved.</span><span class="footer-links"><a href="privacy.html">Privacy</a><a href="index.html#page-sitemap">Sitemap</a></span></footer>
 </div>
</div>
<script>
window.SITE_DATA_READY.then(function(){
 if(!window.SITE_DATA){
  document.querySelector('.page').innerHTML = '<h1>Content could not load</h1><p class="copy">This page needs <code>data.js</code>, which failed to load (check that data.js was uploaded in the same folder as this page). <a href="index.html">Back to Home</a>.</p>';
  return;
 }
 var params = new URLSearchParams(location.search);
 var cat = params.get('cat') || 'editing';
 var data = (window.SITE_DATA.post || {})[cat];
 if(!data){ document.querySelector('.page').innerHTML = '<h1>Not found</h1><p>That section does not exist yet. <a href="post-production.html">Back to Post Production</a>.</p>'; return; }
 document.title = data.label + ' — Ake Petcu';
 document.getElementById('crumb-cat').textContent = data.label.toUpperCase();
 document.getElementById('cat-title').textContent = data.label;
 document.getElementById('cat-tagline').textContent = data.tagline || '';
 var list = document.getElementById('list');
 (data.projects||[]).forEach(function(p){
  var a = document.createElement('a'); a.className='proj'; a.href = 'project.html?cat='+encodeURIComponent(cat)+'&id='+encodeURIComponent(p.id);
  a.innerHTML = '<figure><img src="'+data.cover+'" alt="" loading="lazy"></figure>'+
   '<div class="meta"><div class="ptype">'+p.type+'</div><h2>'+p.title+'</h2><p>'+p.description+'</p></div>'+
   '<div class="go">VIEW PROJECT →</div>';
  list.appendChild(a);
 });
});
</script>
</body></html>
